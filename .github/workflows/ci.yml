name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AirPdf.sln

      - name: Build
        run: dotnet build AirPdf.sln -c Release --no-restore

      - name: Test
        run: dotnet test AirPdf.sln -c Release --no-build --logger "console;verbosity=normal"

      # The Windows release ships a NativeAOT build, and both trimming and AOT fail silently:
      # trimming once stopped the app writing its settings because a reflection-based
      # serializer lost its metadata. Checking here means a regression surfaces on the pull
      # request instead of on the tag that publishes a broken download.
      - name: Check AOT build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = dotnet publish src/AirPdf.App/AirPdf.App.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -o publish/aot-check 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { throw "AOT publish failed with exit code $code." }

          $warnings = @($output | Select-String -Pattern 'warning IL\d{4}')
          if ($warnings.Count -gt 0) {
            $warnings | ForEach-Object { Write-Output $_.Line }
            throw "AOT produced $($warnings.Count) IL warning(s): a reflection path came back."
          }

          $exe = 'publish/aot-check/AirPdf.exe'
          if (-not (Test-Path $exe)) { throw 'The AOT publish output has no AirPdf.exe.' }
          $mb = ((Get-ChildItem publish/aot-check -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB
          if ($mb -gt 90) { throw ('AOT output is {0:N0} MB; that is far above the expected ~60 MB.' -f $mb) }

          ('AOT Windows build: {0:N1} MB over {1} files, no IL warnings.' -f $mb, (Get-ChildItem publish/aot-check -Recurse -File).Count) >> $env:GITHUB_STEP_SUMMARY
