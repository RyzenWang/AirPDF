name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AirPdf.sln

      - name: Build
        run: dotnet build AirPdf.sln -c Release --no-restore

      - name: Test
        run: dotnet test AirPdf.sln -c Release --no-build --logger "console;verbosity=normal"

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Check signing configuration
        shell: pwsh
        run: |
          $cert = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $password = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($cert -xor $password) {
            throw 'Windows signing is half configured: set both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or neither.'
          }

          if ($cert) {
            "Windows: signing with the configured certificate." >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "Windows: no certificate configured, the installer will be unsigned." >> $env:GITHUB_STEP_SUMMARY
            Write-Warning 'Publishing an unsigned Windows installer. SmartScreen will warn until the file builds reputation.'
          }

      # Windows ships a NativeAOT build. It starts in roughly 0.4 s instead of ~5 s because
      # nothing is compiled at run time, at the cost of a larger download (28 MB trimmed ->
      # ~60 MB). The step fails on any IL warning, which is how a reflection path that AOT
      # removed shows up; that is exactly how a trimmed build once stopped writing settings.
      # See docs/ARCHITECTURE.md.
      - name: Publish
        shell: pwsh
        run: |
          $output = dotnet publish src/AirPdf.App/AirPdf.App.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o publish/win-x64 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { throw "AOT publish failed with exit code $code." }

          $warnings = @($output | Select-String -Pattern 'warning IL\d{4}')
          if ($warnings.Count -gt 0) {
            $warnings | ForEach-Object { Write-Output $_.Line }
            throw "AOT produced $($warnings.Count) IL warning(s); fix them before releasing."
          }

          $exe = 'publish/win-x64/AirPdf.exe'
          if (-not (Test-Path $exe)) { throw 'The AOT publish output has no AirPdf.exe.' }
          $mb = ((Get-ChildItem publish/win-x64 -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB
          if ($mb -gt 90) { throw ('AOT output is {0:N0} MB, far above the expected ~60 MB; AOT may not be applied.' -f $mb) }

          ('Windows: NativeAOT build is {0:N0} MB over {1} files, no IL warnings.' -f $mb, (Get-ChildItem publish/win-x64 -Recurse -File).Count) >> $env:GITHUB_STEP_SUMMARY

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install vpk --version $env:VPK_VERSION --tool-path .vpk

      - name: Prepare Windows certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "airpdf-codesign.pfx"
          [IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERT_PATH=$path" >> $env:GITHUB_ENV

      - name: Build installer and portable package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $args = @(
            "pack",
            "--packId", "AirPDF",
            "--packVersion", "${{ steps.version.outputs.value }}",
            "--packDir", "publish/win-x64",
            "--mainExe", "AirPdf.exe",
            "--packTitle", "AirPDF",
            "--packAuthors", "AirPDF contributors",
            "--icon", "src/AirPdf.App/Assets/airpdf.ico",
            "--runtime", "win-x64",
            "--channel", "win",
            "--outputDir", "releases/win"
          )

          if ($env:WINDOWS_CERT_PATH) {
            $sign = "/td sha256 /fd sha256 /f `"$env:WINDOWS_CERT_PATH`" /p `"$env:WINDOWS_CERTIFICATE_PASSWORD`" /tr http://timestamp.digicert.com"
            $args += @("--signParams", $sign)
          }

          & "$PWD\.vpk\vpk.exe" @args

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirPDF-win-x64
          path: releases/win/*

  macos:
    name: macOS ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            arch: arm64
          - os: macos-15-intel
            rid: osx-x64
            arch: x64

    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_APP_SIGN_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
      MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check signing configuration
        shell: bash
        run: |
          if [[ -z "${MACOS_CERTIFICATE_BASE64:-}" ]]; then
            echo "MacOS: no certificates configured, packages will be unsigned and blocked by Gatekeeper." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Publishing unsigned macOS packages. Gatekeeper will refuse them on other machines."
            exit 0
          fi

          missing=0
          for required in MACOS_INSTALLER_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD \
                          MACOS_APP_SIGN_IDENTITY MACOS_INSTALLER_SIGN_IDENTITY \
                          APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID MACOS_KEYCHAIN_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::macOS signing is half configured: $required is missing."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "MacOS: signing and notarizing with the configured certificates." >> "$GITHUB_STEP_SUMMARY"

      # Same gate as Windows and Linux: an AOT build that lost a reflection path still starts
      # and then misbehaves at run time. Xcode's clang comes with the runner image.
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirPdf.App/AirPdf.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/${{ matrix.rid }} 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings; fix them before releasing."
            exit 1
          fi

          test -f "publish/${{ matrix.rid }}/AirPdf" || {
            echo "::error::The AOT publish output has no AirPdf binary."
            exit 1
          }

          mb=$(du -sm "publish/${{ matrix.rid }}" | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~60 MB; AOT may not be applied."
            exit 1
          fi

          echo "macOS ${{ matrix.arch }}: NativeAOT build is ${mb} MB over $(find "publish/${{ matrix.rid }}" -type f | wc -l) files, no IL warnings." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install vpk --version "$VPK_VERSION" --tool-path .vpk

      - name: Import Apple certificate and notary profile
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/airpdf-app.p12"
          INSTALLER_PATH="$RUNNER_TEMP/airpdf-installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/airpdf-signing.keychain-db"

          python3 - "$CERT_PATH" "$MACOS_CERTIFICATE_BASE64" <<'PY'
          import base64, sys
          open(sys.argv[1], "wb").write(base64.b64decode(sys.argv[2]))
          PY
          python3 - "$INSTALLER_PATH" "$MACOS_INSTALLER_CERTIFICATE_BASE64" <<'PY'
          import base64, sys
          open(sys.argv[1], "wb").write(base64.b64decode(sys.argv[2]))
          PY

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials "airpdf-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build pkg and portable package
        shell: bash
        run: |
          args=(
            pack
            --packId "AirPDF-osx-${{ matrix.arch }}"
            --packVersion "${{ steps.version.outputs.value }}"
            --packDir "publish/${{ matrix.rid }}"
            --mainExe AirPdf
            --packTitle AirPDF
            --packAuthors "AirPDF contributors"
            --icon src/AirPdf.App/Assets/airpdf.icns
            --runtime "${{ matrix.rid }}"
            --channel "osx-${{ matrix.arch }}"
            --outputDir "releases/osx-${{ matrix.arch }}"
          )

          if [[ -n "${MACOS_CERTIFICATE_BASE64:-}" ]]; then
            args+=(
              --signAppIdentity "$MACOS_APP_SIGN_IDENTITY"
              --signInstallIdentity "$MACOS_INSTALLER_SIGN_IDENTITY"
              --notaryProfile airpdf-notary
              --keychain "$KEYCHAIN_PATH"
            )
          fi

          ./.vpk/vpk "${args[@]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirPDF-osx-${{ matrix.arch }}
          path: releases/osx-${{ matrix.arch }}/*

  linux:
    name: Linux portable
    needs: test
    # Pinned to the oldest runner still offered: NativeAOT links against the build machine's
    # glibc, and ubuntu-latest (24.04) produced a binary that demanded GLIBC_2.38 and refused
    # to start on 22.04. 22.04 needs GLIBC_2.35, which is the floor this project supports.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # NativeAOT needs clang and zlib; the Windows job gets MSVC and the Windows SDK from the
      # runner image, but the Linux image needs these two installed explicitly.
      - name: Install AOT toolchain
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Same gate as Windows: an AOT build that lost a reflection path still starts and then
      # misbehaves at run time, so any IL warning fails the release.
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirPdf.App/AirPdf.App.csproj \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/linux-x64 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings; fix them before releasing."
            exit 1
          fi

          test -f publish/linux-x64/AirPdf || {
            echo "::error::The AOT publish output has no AirPdf binary."
            exit 1
          }

          mb=$(du -sm publish/linux-x64 | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~60 MB; AOT may not be applied."
            exit 1
          fi

          echo "Linux: NativeAOT build is ${mb} MB over $(find publish/linux-x64 -type f | wc -l) files, no IL warnings." >> "$GITHUB_STEP_SUMMARY"

          # The glibc floor is invisible until someone on an older distro runs the binary, so
          # read it off the produced executable and fail when it creeps up.
          floor=$(objdump -T publish/linux-x64/AirPdf | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "Linux: requires ${floor} at most." >> "$GITHUB_STEP_SUMMARY"
          max_allowed=2.35
          if [ "$(printf '%s\n' "$max_allowed" "${floor#GLIBC_}" | sort -V | tail -1)" != "$max_allowed" ]; then
            echo "::error::The binary requires ${floor}, above the supported ${max_allowed}; build on an older runner."
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          tar -czf "AirPDF-${{ steps.version.outputs.value }}-linux-x64.tar.gz" \
            -C publish/linux-x64 .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPDF-linux-x64
          path: AirPDF-*-linux-x64.tar.gz

  release:
    name: Create GitHub release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest

    steps:
      # A checkout is required before the tag message can be read: this job used to start with
      # download-artifact and had no .git directory at all.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The release body is the matching CHANGELOG section, not the short annotated-tag
      # message. Empty bodies made v0.3.0/v0.3.1 collapse to a compare link, and v0.8.0
      # published only the tag subject. Fall back to the tag message when a preview tag has
      # no changelog section yet.
      - name: Build release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          git fetch --force --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_message=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")

          changelog_notes=$(awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed '/./,$!d')

          if [ -n "$changelog_notes" ]; then
            notes="$changelog_notes"
          else
            echo "::warning::CHANGELOG.md has no section for $version; using the tag message."
            notes="$tag_message"
          fi

          {
            printf '%s\n' "$notes"
            printf '\n---\n\n'
            printf '**Full Changelog**: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          } > "$notes_file"

          echo "Release notes:"
          cat "$notes_file"

      # The builds are unsigned, so the installers are withheld: SmartScreen and Gatekeeper
      # would stop the first launch of an unsigned Setup.exe or .pkg, and the reader would
      # read that as a bug in the app rather than in its distribution. The portable archives
      # and the update feed stay, so the app is still downloadable and upgradable. Remove
      # this step once signing secrets are configured and a signed release has been checked.
      - name: Withdraw the unsigned installers
        shell: bash
        run: |
          found=$(find artifacts -type f \( -name '*Setup.exe' -o -name '*Setup.pkg' \) -print -delete)
          if [ -n "$found" ]; then
            echo "Withheld:"
            echo "$found"
          else
            echo "::warning::No installer was found to withhold; check the packaging output."
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/AirPDF-*
            artifacts/**/releases.*.json
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-preview') }}