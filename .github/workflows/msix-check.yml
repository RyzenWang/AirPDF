name: MSIX check

# Proves the MSIX packaging path end to end: build the package, sign it with a
# throwaway certificate, install it, confirm Windows registered it, launch the
# app, and uninstall. Nothing is published.
#
# This exists because sideloading requires the signing certificate to be trusted
# machine-wide, which needs elevation; local development usually cannot do it.
on:
  workflow_dispatch:
    inputs:
      install:
        description: Install the package and launch the app
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  msix:
    name: Build and install MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the package
        shell: pwsh
        run: |
          ./packaging/signing/New-TestCertificate.ps1 `
            -OutputPath "$env:RUNNER_TEMP/msix-test.pfx" -Password test

          ./packaging/msix/Build-Msix.ps1 `
            -Version 0.0.1.0 `
            -Publisher "CN=AirPDF Test Signing (not for release)" `
            -CertificatePath "$env:RUNNER_TEMP/msix-test.pfx" `
            -CertificatePassword test

      - name: Trust the test certificate
        if: inputs.install
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP/msix-test.pfx"
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $pfx, 'test',
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)

          $cer = "$env:RUNNER_TEMP/msix-test.cer"
          [IO.File]::WriteAllBytes($cer, $cert.Export('Cert'))

          # A self-signed package certificate terminates the chain in itself, so it
          # has to be trusted as a root as well as a trusted person; otherwise
          # Add-AppxPackage fails with 0x800B0109.
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          "trusted $($cert.Thumbprint)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Install the package
        if: inputs.install
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/msix/*.msix | Select-Object -First 1
          Add-AppxPackage -Path $package.FullName -ErrorAction Stop

          $app = Get-AppxPackage -Name AirPDF
          if (-not $app) { throw 'The package installed but Windows does not list it.' }

          $app | Select-Object Name, PackageFullName, Version, InstallLocation |
            Format-List | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

          $manifest = Get-AppxPackageManifest -Package $app.PackageFullName
          $application = $manifest.Package.Applications.Application
          if ($application.EntryPoint -ne 'Windows.FullTrustApplication') {
            throw "Unexpected entry point: $($application.EntryPoint)"
          }
          if ($application.Executable -ne 'AirPdf.exe') {
            throw "Unexpected executable: $($application.Executable)"
          }

          $association = $manifest.Package.Applications.Application.Extensions.Extension |
            Where-Object { $_.Category -eq 'windows.fileTypeAssociation' }
          if (-not $association) { throw 'The .pdf association is missing from the installed manifest.' }

          "registered $($app.Version) with the pdf association" >> $env:GITHUB_STEP_SUMMARY

      - name: Launch the packaged app
        if: inputs.install
        shell: pwsh
        run: |
          $app = Get-AppxPackage -Name AirPDF
          $exe = Join-Path $app.InstallLocation 'AirPdf.exe'
          if (-not (Test-Path $exe)) { throw "The installed package has no AirPdf.exe at $exe." }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12

          $process.Refresh()
          if ($process.HasExited) {
            throw "The packaged app exited with code $($process.ExitCode) instead of staying open."
          }

          "the packaged app is running as pid $($process.Id)" >> $env:GITHUB_STEP_SUMMARY
          $process | Stop-Process -Force

      # File association activation is what Windows does when a user opens a PDF
      # from Explorer: the shell runs the registered executable with the document
      # path as its only argument. The app records every opened document in
      # settings.json, so that file is the observable proof the document actually
      # loaded rather than the argument being ignored.
      - name: Open a document through the file association
        if: inputs.install
        shell: pwsh
        run: |
          $app = Get-AppxPackage -Name AirPDF
          $exe = Join-Path $app.InstallLocation 'AirPdf.exe'

          $directory = Join-Path $env:RUNNER_TEMP 'activation'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null

          # A name with a space and non-ASCII characters exercises the quoting the
          # shell uses when it hands the path over.
          $document = Join-Path $directory 'sample 文档.pdf'
          Copy-Item 'tests/Assets/sample.pdf' $document -Force

          $settings = Join-Path $env:APPDATA 'AirPdf/settings.json'
          if (Test-Path $settings) { Remove-Item $settings -Force }

          # A packaged full-trust app has its %APPDATA% writes redirected into the
          # package's local cache, so the settings file can appear in either place.
          $family = (Get-AppxPackage -Name AirPDF).PackageFamilyName
          $virtualSettings = Join-Path $env:LOCALAPPDATA "Packages/$family/LocalCache/Roaming/AirPdf/settings.json"
          if (Test-Path $virtualSettings) { Remove-Item $virtualSettings -Force }

          $process = Start-Process -FilePath $exe -ArgumentList "`"$document`"" -PassThru

          $candidates = @($settings, $virtualSettings)
          $opened = $false
          $recordedAt = $null

          for ($attempt = 0; $attempt -lt 60 -and -not $opened; $attempt++) {
            Start-Sleep -Milliseconds 500

            foreach ($candidate in $candidates) {
              if (-not (Test-Path $candidate)) { continue }

              try {
                $parsed = Get-Content $candidate -Raw | ConvertFrom-Json
                if (@($parsed.recentFiles | Where-Object { $_.filePath -eq $document }).Count -gt 0) {
                  $opened = $true
                  $recordedAt = $candidate
                  break
                }
              }
              catch {
                # The app may be mid-write; the next attempt re-reads it.
              }
            }
          }

          $process.Refresh()
          if ($process.HasExited) {
            throw "The app exited with code $($process.ExitCode) after being launched with a document."
          }

          if (-not $opened) {
            throw "Launching with '$document' did not open it; no settings file recorded the path (looked in $($candidates -join ' and '))."
          }

          "opened '$document' through the association" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "settings recorded at: $recordedAt"
          if ($recordedAt -eq $virtualSettings) {
            "note: the package redirected %APPDATA% into $virtualSettings" >> $env:GITHUB_STEP_SUMMARY
          }

          $process | Stop-Process -Force

      - name: Uninstall
        if: always() && inputs.install
        shell: pwsh
        run: |
          Get-AppxPackage -Name AirPDF | Remove-AppxPackage -ErrorAction Continue || $true
          foreach ($store in @('Cert:\LocalMachine\TrustedPeople', 'Cert:\LocalMachine\Root')) {
            Get-ChildItem $store |
              Where-Object { $_.Subject -like '*AirPDF Test Signing*' } |
              Remove-Item -Force -ErrorAction Continue
          }

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: AirPDF-msix
          path: artifacts/msix/*.msix
